<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom animations for loading state */
        @keyframes pulse-dot {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        .dot-1 { animation: pulse-dot 1.5s infinite ease-in-out; }
        .dot-2 { animation: pulse-dot 1.5s infinite ease-in-out 0.2s; }
        .dot-3 { animation: pulse-dot 1.5s infinite ease-in-out 0.4s; }
        
        /* Shimmer effect for assistant loading */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-bg {
            background: linear-gradient(90deg, 
                theme('colors.surface-container-lowest') 0%, 
                theme('colors.surface-container-low') 50%, 
                theme('colors.surface-container-lowest') 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: theme('colors.outline-variant'); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.outline'); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar Shared Component -->
<header class="bg-surface border-b border-outline-variant docked full-width top-0 z-40 sticky">
<div class="flex justify-between items-center w-full px-md md:px-lg max-w-container-max mx-auto h-16">
<div class="text-headline-sm font-headline-sm font-bold text-primary flex items-center gap-2">
<span class="material-symbols-outlined" data-weight="fill">library_books</span>
                Librarian Assistant
            </div>
<div class="flex items-center gap-4">
<button aria-label="History" class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-2 rounded-full">
<span class="material-symbols-outlined">history</span>
</button>
<button aria-label="Settings" class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-2 rounded-full">
<span class="material-symbols-outlined">settings</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant ml-2">
<img alt="User profile" class="w-full h-full object-cover" data-alt="A professional headshot of a person looking forward, neutral background, calm lighting. Minimalist style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVSOX5tEYhYh47UKHKVRuxQ2oXjYL3M85swsV1h1KvfoCZeE93hQfBzePtTA5MPwJQW6xAAK06CimVini7Sth4trRHcB-wIVq2lFrjtSpAZOnWbYX_kqkvhU0JT_6gQIATIzfg1MAXlgxRdm0Ayv7mCLob3j5RMegUV_T7VI_UYcSoGoheQbgO1WqrrsAShDuHavEImX-qReh4qEZeFHGqq8lHCVvwhIriKx3dmOThyO1-MIy4TK4YLQ"/>
</div>
</div>
</div>
</header>
<!-- Main Content Canvas - Fixed Center Grid -->
<main class="flex-grow flex flex-col items-center w-full max-w-container-max mx-auto px-md md:px-lg pt-lg pb-xl relative">
<!-- Chat History Area -->
<div class="w-full flex flex-col gap-6 flex-grow pb-32">
<!-- User Message -->
<div class="w-full flex justify-end">
<div class="bg-surface-container-low border border-outline-variant rounded-lg rounded-tr-sm p-4 max-w-[85%] md:max-w-[75%] shadow-sm hover:shadow-md transition-shadow duration-300">
<p class="text-body-md font-body-md text-on-surface">
                        Can you explain the difference between the expense ratio and the 12b-1 fee in the Vanguard 500 Index Fund, and how they impact long-term returns?
                    </p>
</div>
</div>
<!-- Assistant Loading State -->
<div class="w-full flex justify-start">
<div class="bg-surface-container-lowest border border-outline-variant border-l-4 border-l-primary-fixed-dim/50 rounded-lg rounded-tl-sm p-4 max-w-[90%] md:max-w-[80%] shimmer-bg relative overflow-hidden">
<div class="flex items-center gap-3 relative z-10">
<!-- Loading Indicator -->
<div class="flex space-x-1 items-center justify-center h-6 w-8">
<div class="w-1.5 h-1.5 bg-primary-container rounded-full dot-1"></div>
<div class="w-1.5 h-1.5 bg-primary-container rounded-full dot-2"></div>
<div class="w-1.5 h-1.5 bg-primary-container rounded-full dot-3"></div>
</div>
<!-- Text -->
<span class="font-data-mono text-data-mono text-on-surface-variant opacity-80">
                            Checking official sources...
                        </span>
</div>
</div>
</div>
</div>
</main>
<!-- Fixed Input Area & Footer -->
<div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-md border-t border-outline-variant z-30">
<div class="max-w-container-max mx-auto px-md md:px-lg py-4">
<!-- Input Field (Disabled State) -->
<div class="relative w-full opacity-60 pointer-events-none transition-opacity duration-300">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">search</span>
</div>
<textarea class="block w-full pl-12 pr-16 py-3 bg-surface border border-outline-variant rounded-lg text-body-md font-body-md text-outline placeholder-outline focus:ring-0 focus:border-outline-variant resize-none overflow-hidden h-[48px]" disabled="" placeholder="Wait for response..." rows="1"></textarea>
<div class="absolute inset-y-0 right-0 pr-2 flex items-center">
<button class="p-2 text-outline rounded-full bg-surface-container-highest cursor-not-allowed" disabled="">
<span class="material-symbols-outlined" data-weight="fill">arrow_upward</span>
</button>
</div>
</div>
</div>
<!-- Footer Shared Component -->
<footer class="w-full py-4 px-md flex flex-col items-center gap-2 bg-surface-container-low border-t border-outline-variant pb-8 md:pb-4">
<p class="text-label-sm font-label-sm text-on-surface-variant text-center">
<span class="font-bold text-primary mr-2">Facts-only. No investment advice.</span>
</p>
<div class="flex gap-4 items-center justify-center">
<a class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms</a>
<span class="text-outline-variant text-[10px]">•</span>
<a class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy</a>
<span class="text-outline-variant text-[10px]">•</span>
<a class="text-label-sm font-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Data Sources</a>
</div>
</footer>
</div>
</body></html>
