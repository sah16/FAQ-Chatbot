<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-on-surface-variant docked full-width top-0">
<div class="flex justify-between items-center w-full px-md md:px-lg max-w-container-max mx-auto h-16">
<div class="text-headline-sm font-headline-sm font-bold text-primary dark:text-primary-fixed-dim">
        Librarian Assistant
      </div>
<div class="flex items-center gap-4 hidden md:flex">
<!-- Main Nav omitted as per prompt for "minimal nav", but keeping structural hooks if needed -->
</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="text-on-surface-variant dark:text-outline hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-md py-xl md:py-20 max-w-container-max mx-auto w-full">
<div class="text-center mb-12 w-full">
<h1 class="text-headline-lg font-headline-lg text-on-background mb-4">
        Ask about your mutual fund scheme
      </h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">
        Answers are sourced only from official scheme pages
      </p>
</div>
<!-- Question Chips -->
<div class="flex flex-col gap-4 w-full max-w-[600px] mb-16">
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-full px-6 py-3 text-body-md font-body-md font-medium text-on-surface hover:shadow-sm hover:border-primary-container transition-all group flex items-center justify-between">
<span>What's the exit load on HDFC Mid-Cap Fund?</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-full px-6 py-3 text-body-md font-body-md font-medium text-on-surface hover:shadow-sm hover:border-primary-container transition-all group flex items-center justify-between">
<span>What's the minimum SIP for HDFC Nifty 50 Index Fund?</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-full px-6 py-3 text-body-md font-body-md font-medium text-on-surface hover:shadow-sm hover:border-primary-container transition-all group flex items-center justify-between">
<span>What's the riskometer rating for HDFC Balanced Advantage Fund?</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Chat Input Area -->
<div class="w-full max-w-[720px] mt-auto md:mt-0 relative">
<div class="relative bg-surface-container-lowest rounded-lg border border-outline-variant focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all shadow-sm">
<textarea class="w-full bg-transparent border-none focus:ring-0 resize-none py-4 pl-4 pr-12 text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant h-16 min-h-[64px]" placeholder="Ask a question..." rows="1"></textarea>
<button class="absolute right-2 top-1/2 -translate-y-1/2 bg-primary-container text-on-primary rounded-full p-2 hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined" data-icon="arrow_upward">arrow_upward</span>
</button>
</div>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-4 px-md flex flex-col items-center gap-2 full-width bg-surface-container-low dark:bg-surface-container border-t border-outline-variant dark:border-on-surface-variant mt-auto hidden md:flex">
<div class="font-bold text-primary text-label-sm font-label-sm mb-2">Facts-only. No investment advice.</div>
<div class="flex gap-4">
<a class="text-on-surface-variant dark:text-outline hover:text-primary transition-colors text-label-sm font-label-sm" href="#">Terms</a>
<a class="text-on-surface-variant dark:text-outline hover:text-primary transition-colors text-label-sm font-label-sm" href="#">Privacy</a>
<a class="text-on-surface-variant dark:text-outline hover:text-primary transition-colors text-label-sm font-label-sm" href="#">Data Sources</a>
</div>
</footer>

<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed-dim font-semibold scale-95 transition-transform text-label-sm font-label-sm" href="#">
<span class="material-symbols-outlined mb-1" data-icon="search">search</span>
      Research
    </a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-primary-fixed-dim text-label-sm font-label-sm" href="#">
<span class="material-symbols-outlined mb-1" data-icon="menu_book">menu_book</span>
      Glossary
    </a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-primary-fixed-dim text-label-sm font-label-sm" href="#">
<span class="material-symbols-outlined mb-1" data-icon="bookmark">bookmark</span>
      Saved
    </a>
</nav>
