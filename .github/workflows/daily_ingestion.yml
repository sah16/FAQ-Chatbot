name: Daily Ingestion & Freshness Scheduler

on:
  schedule:
    # 9:30 AM IST (Indian Standard Time) is 04:00 AM UTC (UTC + 5:30)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-daily-ingestion:
    name: Ingest & Refresh 5 Groww Scheme Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Scheduler
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m ingestion.scheduler

      - name: Commit and Push Updated Vector Store (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vector_store.json
          if git diff --staged --quiet; then
            echo "No changes detected in vector store. Working tree clean."
          else
            git commit -m "chore(data): automated daily vector store freshness update [skip ci]"
            git pull --rebase origin master || true
            git push origin master
          fi
